name: Test Drive access from Actions runner
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try downloading files currently blocked from the local machine
        run: |
          FILES="1T4DT0cBHrxm6uKgAAv2QEkGlBqpYxz8J 1qSOGbqBX_JFD2y9zhj_rkxgpsQRF_n7A 1YRcfEAirIMiXHCicNkZ8jev2JytdEHVH 1fX7prMKjZJACs0aEj7Hhe-J0vrZ2MFLs 1eFnI9_CckUfPlkqO7Qm-uBYV2d_6vpdB"
          ok=0
          blocked=0
          for id in $FILES; do
            curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
              "https://drive.google.com/uc?export=download&id=$id" -o /tmp/test.bin
            head_bytes=$(head -c 5 /tmp/test.bin)
            size=$(wc -c < /tmp/test.bin)
            if [ "$head_bytes" = "%PDF-" ]; then
              echo "$id: OK (PDF, $size bytes)"
              ok=$((ok+1))
            else
              echo "$id: BLOCKED (not a PDF, $size bytes)"
              if grep -q "ServiceLogin\|accounts.google.com" /tmp/test.bin; then
                echo "  -> sign-in wall detected"
              fi
              blocked=$((blocked+1))
            fi
          done
          echo ""
          echo "Result: $ok ok, $blocked blocked"
          if [ "$blocked" -gt 0 ]; then exit 1; fi
